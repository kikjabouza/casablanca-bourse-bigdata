services:

  # ─── Base de données Cassandra ───────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./cassandra:/cassandra:ro
    environment:
      - CASSANDRA_CLUSTER_NAME=bourse-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # ─── Initialisation du schéma Cassandra (exécution unique au premier lancement) ──
  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra:/cassandra:ro
    command: >
      bash -c "cqlsh cassandra 9042 -f /cassandra/init.cql &&
               echo '==> Schema Cassandra initialise avec succes'"
    restart: "no"

  # ─── Moteur SQL Trino (connecteur vers Cassandra) ────────────────────────────
  trino:
    image: trinodb/trino:426
    container_name: trino
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/etc/password.db:/etc/trino/password.db:ro
      - ./trino/etc/trino.jks:/etc/trino/trino.jks:ro
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # ─── Serveur Prefect (Orchestration des flows) ───────────────────────────────
  prefect-server:
    image: prefecthq/prefect:2.19.3-python3.11
    container_name: prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////root/.prefect/prefect.db
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ─── Scraper Worker (Prefect serve : enregistre les deployments + exécute les flows) ──
  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: scraper-worker
    # Attend que Cassandra ET le serveur Prefect soient prêts
    depends_on:
      cassandra:
        condition: service_healthy
      prefect-server:
        condition: service_started
    volumes:
      - .:/app          # code source monté en live (modifications sans rebuild)
    environment:
      # Cassandra : hostname Docker interne (≠ localhost qui est le PC hôte)
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=bourse_data
      - CASSANDRA_STUB=false
      # Prefect : pointe vers le serveur sur le réseau Docker interne
      - PREFECT_API_URL=http://prefect-server:4200/api
      # Scraping
      - BOURSE_BASE_URL=https://www.casablanca-bourse.com
      - TRACKED_INSTRUMENTS=ATW,BCP,MNG
      - REQUEST_DELAY=0.5
    restart: unless-stopped

  # ─── Metabase (Dashboards de reporting) ─────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.50.4
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
      - ./trino/etc/trino.cer:/tmp/trino.cer:ro
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/java/openjdk/bin/keytool -import -alias trino -file /tmp/trino.cer \
          -keystore /tmp/ts.jks -storepass changeit -noprompt 2>/dev/null || true
        exec /app/run_metabase.sh
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  cassandra-data:
  prefect-data:
  metabase-data:
